<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AliExpress Product Research{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">AliExpress Product Research</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'products' %}active{% endif %}" href="/">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'momentum' %}active{% endif %}" href="/momentum">Momentum</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_page == 'shortlists' %}active{% endif %}" href="/shortlists">Shortlists</a>
          </li>
        </ul>
        {% if email %}
        <span class="navbar-text me-3 text-truncate">Signed in as {{ email }}</span>
        <a class="btn btn-outline-secondary btn-sm" href="/logout">Log out</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container-fluid px-3 px-lg-4 pb-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
